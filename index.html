<style>
/* Layout: one-column phone terminal. Sticky prompt header, scrolling "screens", fixed tab bar at the bottom. */
:root{
  --bg:#13110e; --panel:#1c1915; --panel2:#24201b; --line:#353028; --fg:#ece4d4; --dim:#968c7a;
  --accent:#e07a52; --amber:#f0b64a; --ok:#86c98f; --bad:#e8675c;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --crt:"VT323","JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font:14px/1.5 var(--mono);padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:50}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px}
.logo b{font:400 30px/1 var(--crt);color:var(--accent);letter-spacing:.5px}
.logo small{color:var(--dim);font-size:11px}
.status{margin-left:auto;font-size:11px;color:var(--dim);text-align:right}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.status .dot.warn{background:var(--amber)} .status .dot.err{background:var(--bad)}
.cursor{display:inline-block;width:.6em;height:1em;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
main{display:flex;flex-direction:column;gap:14px;padding-block:14px}
.prompt{color:var(--dim);font-size:12px}
.prompt i{font-style:normal;color:var(--accent)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav h1{font:400 30px/1 var(--crt);margin:0;flex:1;letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.daynav h1 span{color:var(--dim);font-size:22px}
.box{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box.hot{border-color:var(--accent)}
.boxh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.boxh h2{font:400 26px/1 var(--crt);margin:0;color:var(--amber);letter-spacing:.5px}
.boxh .tag{margin-left:auto}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);padding:2px 7px;border-radius:3px;color:var(--dim);white-space:nowrap}
.tag.a{color:var(--accent);border-color:var(--accent)} .tag.ok{color:var(--ok);border-color:var(--ok)} .tag.am{color:var(--amber);border-color:var(--amber)}
.muted{color:var(--dim)} .small{font-size:12px}
.code{font:400 40px/1 var(--crt);color:var(--accent);letter-spacing:1px}
.list{display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.row{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line)}
.row .amt{font:400 24px/1 var(--crt);color:var(--amber);min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--dim);font-size:11.5px;line-height:1.4}
.row .amt{white-space:nowrap}
@media (max-width:440px){.row .pat{display:none}.row .amt{min-width:52px}}
.row .pat{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
button,.btn{font:600 13px var(--mono);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:11px 14px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:#1a0f09}
button.ghost{background:transparent}
button.sm{min-height:36px;padding:6px 10px;font-size:12px}
button.on{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .top{display:flex;align-items:baseline;gap:6px}
.meter .v{font:400 30px/1 var(--crt);font-variant-numeric:tabular-nums}
.meter .of{color:var(--dim);font-size:12px}
.meter .lbl{margin-left:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.done{background:var(--ok)}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);min-width:0}
input,select,textarea{font:400 16px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%;min-height:44px}
textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer;text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg)}
.check .bx{width:20px;height:20px;border:1px solid var(--dim);border-radius:3px;display:grid;place-items:center;flex:none;font-size:13px;color:var(--bg)}
.check.done .bx{background:var(--ok);border-color:var(--ok)}
.check.done .t{color:var(--dim);text-decoration:line-through}
.check .s{margin-left:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:36px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";color:var(--accent)}
details[open]>summary::before{content:"▾"}
.flash{border:1px solid var(--ok);color:var(--ok);padding:10px 12px;border-radius:4px;font-size:13px;white-space:pre-line}
.warnbox{border:1px dashed var(--amber);color:var(--amber);padding:10px 12px;border-radius:4px;font-size:12.5px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;gap:4px;max-width:560px;width:100%}
nav.tabs button{flex:1;background:transparent;border:0;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px}
nav.tabs button b{font:400 22px/1 var(--crt)}
nav.tabs button.on{color:var(--accent)}
/* timer overlay */
#tmr{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));gap:14px}
#tmr .clock{font:400 min(30vw,150px)/1 var(--crt);text-align:center;color:var(--accent);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(224,122,82,.35)}
#tmr .clock.rest{color:var(--ok);text-shadow:0 0 18px rgba(134,201,143,.3)}
#tmr .now{text-align:center;font:400 30px/1.1 var(--crt);color:var(--amber);min-height:34px}
#tmr .sub{text-align:center;color:var(--dim);font-size:13px;min-height:20px}
#tmr .body{flex:1;overflow:auto;min-height:0}
#tmr .counter{display:flex;align-items:center;justify-content:center;gap:16px}
#tmr .counter b{font:400 56px/1 var(--crt);min-width:70px;text-align:center}
#tmr .counter button{min-width:64px;font-size:22px}
.hm{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.hm i{aspect-ratio:1;border-radius:2px;background:var(--panel2);border:1px solid var(--line);max-width:100%}
.hm i.d{background:var(--accent);border-color:var(--accent)}
.hm i.p{background:var(--line)}
.hm i.t{outline:1px solid var(--amber)}
.hm i.f{opacity:.25}
.stat{display:flex;flex-direction:column;align-items:flex-start}
.grid3>*,.grid2>*{min-width:0}
.stat b{font:400 clamp(24px,8.5vw,38px)/1 var(--crt);white-space:nowrap;color:var(--amber);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
svg text{font-family:var(--mono);font-size:10px;fill:var(--dim)}
.chart svg text{font-size:9.5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px dashed var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.up{color:var(--bad)} .down{color:var(--ok)}
.lvl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.lvl .nm{flex:1;min-width:0}
.lvl .nm small{display:block;color:var(--dim);font-size:11px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);text-transform:none;letter-spacing:0;font-size:14px;color:var(--fg);flex-direction:row}
.toggle input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.chart{display:flex;flex-direction:column;gap:6px;min-width:0}
.chart svg{display:block;touch-action:manipulation}
.chart rect.sel{fill:var(--fg);fill-opacity:.07}
.readout{font-size:12px;color:var(--fg);min-height:18px;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.legend span{display:flex;align-items:center;gap:6px}
.legend .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.5}
.legend .ln{width:16px;height:2px;background:var(--accent)}
.seg{display:flex;gap:6px}.seg button{flex:1}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{display:flex;align-items:center;gap:10px;min-width:0}
.ring svg{flex:none}.ring svg text{font-family:var(--crt)}
.ring div{display:flex;flex-direction:column;min-width:0}
.ring b{font-weight:600;font-size:13px}.ring span{font-size:11px;color:var(--dim)}
.multi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sm-box{padding:10px;gap:4px}
.mh{display:flex;align-items:baseline;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.mh b{font:400 26px/1 var(--crt);color:var(--fg);letter-spacing:0;text-transform:none}
.up{color:var(--bad)} .down{color:var(--ok)}
nav.tabs button{font-size:10px}
.switch{display:flex;gap:8px;flex-wrap:wrap}.switch .seg{flex:1 1 160px}
.seg button:disabled{opacity:.35}
a.demo{color:var(--accent);text-decoration:none;white-space:nowrap}
button.lnk{background:none;border:0;min-height:0;padding:2px 4px;font:400 11.5px var(--mono);color:var(--dim);white-space:nowrap}
.hero .lvlrow{display:flex;gap:14px;align-items:center}
.lvlnum{font:400 64px/1 var(--crt);color:var(--accent);min-width:56px;text-align:center;text-shadow:0 0 14px rgba(224,122,82,.35)}
.lvlinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lvlinfo .t{font:400 28px/1 var(--crt);color:var(--amber)}
.attr{display:flex;gap:12px;align-items:center;padding:6px 0}
.ak{font:400 24px/1 var(--crt);color:var(--accent);width:64px;flex:none}
.ab{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ab .an{display:flex;justify-content:space-between;font-size:13px}
.ab small{color:var(--dim);font-size:11px}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.achi{border:1px dashed var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.achi b{font-size:12px;color:var(--dim)}.achi span{font-size:11px;color:var(--dim)}
.achi.on{border-style:solid;border-color:var(--accent)}.achi.on b{color:var(--accent)}.achi.on span{color:var(--fg)}
.hm i.z{background:repeating-linear-gradient(45deg,var(--accent) 0 2px,transparent 2px 4px);border-color:var(--accent)}
.htabs{flex-wrap:wrap}.htabs button{flex:1 1 22%}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{flex:1 1 30%}
.tree{display:flex;flex-direction:column;position:relative;padding-left:4px}
.node{display:flex;gap:12px;position:relative;padding-bottom:14px}
.node::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.node:last-child::before{display:none}
.node.on::before{background:var(--accent)}
.pip{font:400 28px/28px var(--crt);width:28px;text-align:center;color:var(--dim);flex:none;background:var(--bg)}
.node.on .pip{color:var(--accent);text-shadow:0 0 10px rgba(224,122,82,.5)}
.node.next .pip{color:var(--amber)}
.nb{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.node.on .nb{border-color:var(--accent)}
.node.next .nb{border-color:var(--amber);border-style:dashed}
.nt{display:flex;justify-content:space-between;gap:8px;width:100%;align-items:baseline}
.nt b{font-weight:600}
.bossin{display:flex;gap:8px}.bossin input{flex:1;min-width:0}.bossin button{flex:none}
.bossbar{width:100%;text-align:left;border:1px dashed var(--amber);color:var(--amber);background:transparent}
.filebtn{display:flex;align-items:center;justify-content:center;text-transform:none;letter-spacing:0;font:600 13px var(--mono);color:var(--fg);cursor:pointer}
body.has-cta{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#cta{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:29;padding:8px 16px;background:linear-gradient(transparent,var(--bg) 35%);display:flex;justify-content:center}
#cta button{width:100%;max-width:560px;font-size:15px;min-height:50px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:31;max-width:528px;margin:0 auto;background:var(--panel2);border:1px solid var(--accent);border-radius:4px;padding:8px 8px 8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.week{display:flex;align-items:stretch;gap:4px}
.wk{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.wkn{min-width:28px;padding:0 4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;min-height:0;background:var(--panel);border:1px solid var(--line);font-weight:400;min-width:0}
.wd span{font-size:10px;color:var(--dim)}.wd b{font:400 22px/1 var(--crt)}.wd i{font-style:normal;font-size:11px;color:var(--dim);line-height:1}.wd em{font-style:normal;font-size:8.5px;letter-spacing:.04em;color:var(--dim)}
.wd.done i{color:var(--accent)}.wd.today{border-color:var(--amber)}.wd.today i{color:var(--amber)}
.wd.sel{background:var(--panel2);border-color:var(--accent)}.wd.sel b{color:var(--accent)}
.chipsrow{display:flex;gap:6px;flex-wrap:wrap}
#tmr{overflow:auto}
#tmr .thead{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tmr .tbar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}#tmr .tbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s linear}
#tmr .clock.mid{font-size:min(18vw,84px)}
#tmr .stage{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
#tmr .stage .big{font:400 min(26vw,120px)/1 var(--crt);color:var(--amber);font-variant-numeric:tabular-nums}
#tmr .stage .mv{font:600 20px/1.25 var(--mono);text-wrap:balance}
#tmr .stage .cue{color:var(--dim);font-size:13px;max-width:34ch}
#tmr .stage .nx{color:var(--dim);font-size:12.5px;border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
#tmr .grow{flex:1;display:flex;flex-direction:column;justify-content:center}
#tmr .queue{display:flex;flex-direction:column;gap:2px;max-width:420px;width:100%;margin:0 auto}
#tmr .qh{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
#tmr .q{display:grid;grid-template-columns:18px minmax(64px,auto) 1fr;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line);color:var(--dim)}
#tmr .q .qa{text-align:right;font-variant-numeric:tabular-nums}
#tmr .q.c{color:var(--fg)}#tmr .q.c .qm,#tmr .q.c .qa{color:var(--accent)}
#tmr .q.d{opacity:.55}
.playbtns{display:grid;grid-template-columns:1fr 2.2fr;gap:10px}
.playbtns button{min-height:64px;font-size:16px}
.playbtns:has(> :only-child){grid-template-columns:1fr}
#tdone{font-size:20px;letter-spacing:.06em}
.tctl button{flex:1}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:41}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:42;background:var(--panel);border-top:1px solid var(--accent);border-radius:10px 10px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:600px;margin:0 auto}
.cirow{display:flex;flex-direction:column;gap:6px}.cil{display:flex;justify-content:space-between;align-items:baseline}
.cib{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cib button{min-height:46px;font-size:16px}
#cele{position:fixed;inset:0;z-index:60;background:rgba(10,9,7,.94);display:flex;align-items:center;justify-content:center;padding:24px 16px;cursor:pointer}

#cele .cbanner{margin:0;font:400 64px/1 var(--crt);color:var(--accent);text-align:center;text-shadow:0 0 18px rgba(224,122,82,.5)}

.report{border-color:var(--amber)}
.hav{margin-left:auto;display:flex;align-items:center}.hav+.status{margin-left:8px}
.avatar{image-rendering:pixelated;flex:none}
.avatar.aura{filter:drop-shadow(0 0 6px var(--amber))}
.tag-btn{margin-left:auto;min-height:32px;padding:4px 10px;font-size:11.5px}
.hm i.r{background:transparent;border-style:dashed}
ol.steps{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13px}
#setupflow{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ob{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px}
.obbar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}.obbar i{display:block;height:100%;background:var(--accent)}
.obbody{flex:1;display:flex;flex-direction:column;gap:12px}
.obh{color:var(--dim);font-size:12px}
.obt{font:400 34px/1.05 var(--crt);color:var(--amber);margin:0}

.sw{display:flex;gap:10px}

.swatch.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.obhero{display:flex;align-items:center;gap:16px}
.obnav{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}

.plan{display:flex;flex-direction:column;gap:6px}
.planrow{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,.8fr);align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)}
.planrow .pd{font:400 20px/1 var(--crt);color:var(--accent)}

function exerciseFor(pat,r,lv,loc='home'){
 const P=PAT[pat],L=lv||S.profile.levels[pat]||{i:0,v:1};let i=Math.min(L.i,P.ladder.length-1);
 if(P.win&&r){const lo=Math.max(0,i-(P.win-1));i=lo+Math.floor(r()*(i-lo+1))}
 const tryR=j=>{const o=rungOpts(P.ladder[j],loc);if(!o.length)return null;if(!r||o.length===1)return o[0];return r()<.5?o[0]:o[1+Math.floor(r()*(o.length-1))]};

 for(let j=i+1;j<P.ladder.length;j++){const x=tryR(j);if(x)return x}
 return null;
}

function pickVariant(pat,r,recent,loc){

 for(let t=0;t<6&&seen(ex);t++)ex=exerciseFor(pat,r,null,loc);

 if(!P.win&&L.i>0&&r()<.25){const alt=exerciseFor(pat,r,{i:L.i-1,v:1},loc);if(alt&&alt.id!==ex.id&&!seen(alt))return {ex:alt,vm:1.25}}

}

function progress(items,rating){
 const pats=[...new Set(items.map(i=>i.pat))],msgs=[];
 editProfile(p=>{
  for(const pat of pats){
   const L=p.levels[pat]||(p.levels[pat]={i:0,v:1}),P=PAT[pat];
   const d=rating==='easy'?.1:rating==='right'?.04:-.1;
   L.v=Math.round(Math.min(1.5,Math.max(.6,L.v+d))*100)/100;
   if(L.v>=1.3){
    let j=L.i+1;while(j<P.ladder.length&&!(P.ladder[j].q||[]).every(e=>p.equip[e]))j++;
    if(j<P.ladder.length){L.i=j;L.v=.9;msgs.push(`▲ ${P.label}: level up → ${P.ladder[j].n}`)}
    else{L.v=Math.min(L.v,1.5)}
   }else if(L.v<=.6&&L.i>0){L.i--;L.v=1;msgs.push(`▼ ${P.label}: easing to ${P.ladder[L.i].n}`)}
   else if(d>0)msgs.push(`+ ${P.label}: volume ${Math.round(L.v*100)}%`);
   else msgs.push(`− ${P.label}: volume ${Math.round(L.v*100)}%`);
  }
 });
 return msgs;
}

// rough lifetime rep count for one logged move
function estReps(w,it){
 if(it.u==='sec'||w.format==='intervals')return 0;
 const per=it.u==='side'?it.amt*2:it.amt,r=w.result||{};
 if(w.format==='fortime')return per*(w.rounds||4);
 if(w.format==='chipper')return per;
 if(w.format==='amrap')return per*(+r.rounds||0);
 if(w.format==='ladder'){const n=+r.rounds||0;return per*n*(n+1)/2}
 if(w.format==='emom')return per*Math.floor((w.mins||20)/w.items.length);
 return 0;
}
function computeHero(){
 if(HERO)return HERO;
 const g=S.profile.goals,keys=allDayKeys(),t=TODAY();
 const attr={STR:0,END:0,CORE:0,MOB:0,DISC:0};
 const h={xp:0,reps:0,burpees:0,workouts:0,runs:0,mobs:0,proteinDays:0,weighIns:0,hardOnes:0,outSprint:false,locs:0,waterRun:0,perDay:{}};
 const locs=new Set();const normLoc=l=>l==='out'?'yard':(l||'home');let wr=0,prev=null;
 for(const k of keys){
  const d=getDay(k);let x=0;
  if(d.workout&&d.workout.result){
   const w=d.workout;x+=100;h.workouts++;locs.add(normLoc(w.loc));
   if(w.result.rating==='hard'){x+=15;h.hardOnes++}
   for(const it of w.items){const n=estReps(w,it);h.reps+=n;if(BURPEE_IDS.has(it.id))h.burpees+=n;attr[PAT[it.pat]?.attr||'STR']+=3;if(it.pat==='sprint')h.outSprint=true}
  }
  if(d.warm){x+=10;attr.MOB+=2}
  if(d.cool){x+=10;attr.MOB+=2}
  if(d.run&&d.run.done){x+=100;h.runs++;attr.END+=8}
  if(d.mob&&d.mob.done){x+=80;h.mobs++;attr.MOB+=6}
  if(+d.protein>=g.protein){x+=20;h.proteinDays++;attr.DISC+=2}
  const wHit=+d.water>=g.water;if(wHit){x+=10;attr.DISC+=2}
  wr=wHit?(prev&&daysBetween(prev,k)===1&&wr>0?wr+1:1):0;if(wHit)prev=k;h.waterRun=Math.max(h.waterRun,wr);
  if(+d.walk>=g.walk){x+=15;attr.DISC+=2;attr.END+=1}
  if(d.weight){x+=5;h.weighIns++;attr.DISC+=1}
  if(d.meas&&Object.values(d.meas).some(Boolean))x+=10;
  h.perDay[k]=x;h.xp+=x;
 }
 h.locs=locs.size;
 h.ladderUps=(S.profile.log||[]).filter(e=>/▲/.test(e.m)).length;attr.STR+=h.ladderUps*10;
 // streak with freeze tokens: a token is earned every 7 straight days (max 2) and covers one missed day
 let cur=0,best=0,tok=0;const frozen=new Set();const first=keys.find(dayDone);
 if(first)for(let k=first;k<=t;k=addDays(k,1)){
  if(dayDone(k)||isRest(k)){cur++;best=Math.max(best,cur);if(cur%7===0){tok=Math.min(2,tok+1);h.xp+=50}}
  else if(k!==t){if(tok>0&&cur>0){tok--;frozen.add(k)}else cur=0}
 }
 Object.assign(h,{streak:cur,best,tokens:tok,frozen,sessions:h.workouts+h.runs+h.mobs});
 h.bossFights=0;h.prs=0;
 for(const b of BOSSES){let best=null;for(const e of (S.profile.bosses||{})[b.id]||[]){h.bossFights++;h.xp+=75;if(best!=null&&(b.lower?e.v<best:e.v>best)){h.prs++;h.xp+=100}best=best==null?e.v:(b.lower?Math.min(best,e.v):Math.max(best,e.v))}}
 h.skills=ALL_NODES.filter(nodeMet).map(n=>n.id);
 const base=new Set(S.profile.base||[]);
 h.xp+=ALL_NODES.filter(n=>h.skills.includes(n.id)&&!base.has(n.id)).reduce((a,n)=>a+100*n.tier,0);
 h.ach=ACH.filter(a=>a.t(h)).map(a=>a.id);
 h.xp+=ACH.filter(a=>h.ach.includes(a.id)).reduce((s,a)=>s+a.xp,0);
 h.L=levelOf(h.xp);h.title=titleOf(h.L);
 h.attr=Object.fromEntries(Object.entries(attr).map(([k,p])=>{const lv=Math.floor(Math.sqrt(p/4))+1,lo=4*(lv-1)**2,hi=4*lv**2;return [k,{p,lv,pct:(p-lo)/(hi-lo)}]}));
 return HERO=h;
}
// run an edit and report XP, level-ups and unlocks it caused
function withXP(fn,{always=false}={}){
 const a=computeHero(),before={xp:a.xp,L:a.L,ach:new Set(a.ach),sk:new Set(a.skills)};
 fn();clearGen();const b=computeHero(),msgs=[];
 const gain=b.xp-before.xp;
 if(gain>0&&(always||gain>=15))msgs.push(`+${gain} XP`);
 if(b.L>before.L)msgs.push(`LEVEL UP → ${b.L} · ${b.title}`);
 for(const id of b.skills)if(!before.sk.has(id)&&!(S.profile.base||[]).includes(id)){const N=ALL_NODES.find(x=>x.id===id);msgs.push(`SKILL UNLOCKED ${N.n} (+${100*N.tier} XP)`)}
 for(const id of b.ach)if(!before.ach.has(id)){const A=ACH.find(x=>x.id===id);msgs.push(`UNLOCKED ${A.n} (+${A.xp} XP)`)}
 if(msgs.some(m=>/^LEVEL UP|^SKILL UNLOCKED|^UNLOCKED/.test(m)))setTimeout(()=>celebrate(msgs),80);
 return msgs;
}

function vHistory(){

 h+=`<div class="box"><div class="boxh"><h2>SESSIONS</h2></div>${rows?`<div class="list">${rows}</div>`:'<div class="muted small">Finished workouts, runs and mobility days land here. Tap one to open that day.</div>'}</div>`;

function swapItem(i,ban){
 const k=S.view,w=structuredClone(workoutFor(k)),it=w.items[i];if(!it)return;
 const loc=w.loc||dayLoc(k),old=it.id;
 if(ban)editProfile(p=>{p.ban=[...new Set([...(p.ban||[]),old])]});
 const used=new Set(w.items.map(x=>x.id)),usedF=new Set(w.items.map(x=>fam(x.n)));
 let c=swapCands(it.pat,loc).filter(o=>!used.has(o.id)&&!usedF.has(fam(o.n)));
 let pat=it.pat;
 if(!c.length&&/burpee|sprint/.test(it.pat)){c=swapCands('cardio',loc).filter(o=>!used.has(o.id));pat='cardio'}
 if(!c.length){S.flash=ban?'> Hidden from future workouts. Nothing else fits this slot today, so it stays.':'> No other option at this level with your current equipment.';render();return}
 w.swaps=(w.swaps||0)+1;const ex=c[(w.swaps-1)%c.length];
 w.items[i]=makeItem(ex,pat,1,{f:w.format,dl:w.deload?.75:1,m:(w.mins||20)/20,loc});
 editDay(k,d=>{d.workout=w});S.flash=ban?`> Hidden for good: ${fam(it.n)}. Unhide it in Setup.`:'';render();setTimeout(showToast,0);
}
function saveResult(){
 const k=S.view,w=structuredClone(workoutFor(k)),F=FORMATS[w.format];
 const rating=S.rating||(w.result&&w.result.rating);
 if(!rating){S.flash='Pick how it felt first: too easy, just right, or too hard.';render();return}
 const r={rating,notes:($('#r-notes')?.value||'').trim(),savedAt:Date.now()};
 if(F.timer==='up'){const t=parseTime($('#r-time')?.value);if(t!=null)r.time=t}
 if(F.timer==='amrap'){const ro=$('#r-rounds')?.value,re=$('#r-reps')?.value;if(ro!=='')r.rounds=+ro;if(re)r.reps=+re}
 const first=!w.result;
 let xpm=[];
 xpm=withXP(()=>{
 r.prog=first?progress(w.items,rating):(w.result.prog||[]);
 w.result=r;
 editDay(k,d=>{d.workout=w});
 if(first&&r.prog.length)editProfile(p=>{p.log=[...(p.log||[]),...r.prog.filter(m=>/▲|▼/.test(m)).map(m=>({k,m}))].slice(-200)});
 },{always:true});
 S.form=null;S.rating=null;S.pendingResult=null;
 S.flash=first?`> ${w.name} logged.\n${xpm.join('\n')}${r.prog.length?'\n'+r.prog.join('\n'):''}`:'> Result updated.';
 render();scrollTo(0,0);
}

/* ============ timer + workout player ============ */
let AC=null,wake=null,tickId=null;
const short=n=>n.split(' · ')[0];
function beep(f=880,d=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}try{navigator.vibrate&&navigator.vibrate(d>.2?300:80)}catch(e){}}
async function lockScreen(){try{wake=await navigator.wakeLock?.request('screen')}catch(e){wake=null}}
// voice cues (iPhone speaks only after a tap, so the Start tap unlocks it)
const voiceOn=()=>S.profile.voice!==false&&!S.muted&&('speechSynthesis' in window);
function say(text){try{if(!voiceOn())return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
const spoken=n=>short(n).replace(/\(.*?\)/g,'').replace(/\bKB\b/g,'kettlebell').replace(/\bDBs?\b/g,'dumbbell').replace(/(\d+) yd/g,'$1 yards').replace(/\s+/g,' ').trim();
const sayAmt=(it,mult=1)=>{const a=it.amt*mult;return it.u==='sec'?`${a} seconds of ${spoken(it.n)}`:`${a}${it.u==='side'?' per side,':''} ${spoken(it.n)}`};
const STEP_FMT={fortime:1,chipper:1,amrap:1,ladder:1};
function stepAt(t,pos){const w=t.w,n=w.items.length,idx=pos%n,round=Math.floor(pos/n);return {it:w.items[idx],idx,round,mult:w.format==='ladder'?round+1:1}}
const totalSteps=t=>{const w=t.w,n=w.items.length;return w.format==='fortime'?n*(w.rounds||4):w.format==='chipper'?n:Infinity};

function startWorkout(){
 const k=S.view,d=getDay(k);
 if(!d.checkin){S.ci={sleep:3,sore:3,energy:3};S.sheet='checkin';render();return}
 launchWorkout(k);
}
function launchWorkout(k){
 const w0=workoutFor(k);editDay(k,d=>{if(!d.workout)d.workout=structuredClone(w0)});
 const w=getDay(k).workout;
 const kind=STEP_FMT[w.format]?'play':w.format==='emom'?'emom':'int';
 const total=w.format==='intervals'?(w.rounds||4)*w.items.length*60:(w.mins||20)*60;
 say(`Get ready. ${fmtL(w).replace(' / ',' ')}. First: ${sayAmt(w.items[0])}`);
 openTimer({kind,total,w,k,pos:0,work:w.recovery?30:40});
}
function startSeq(which){
 const k=S.view,type=SCHED[parseKey(k).getDay()];
 const steps=which==='warm'?warmFor(type):which==='cool'?coolFor(type):which==='mob'?mobFor(k).steps:runFor(k).steps;
 const label={warm:'WARM-UP',cool:'COOL-DOWN',mob:mobFor(k).name,run:runFor(k).name}[which];
 say(`${label.split(' · ')[0].toLowerCase()}. First: ${steps[0][0]}`);
 openTimer({kind:'seq',steps,total:seqSecs(steps),label,which,k});
}
function openTimer(t){
 beep(660,.05);lockScreen();
 S.timer={...t,acc:-5,t0:Date.now(),run:true,last:null,stage:null};
 const ov=$('#tmr');ov.hidden=false;document.body.style.overflow='hidden';
 drawTimer(true);clearInterval(tickId);tickId=setInterval(()=>drawTimer(false),200);
}
function elapsed(){const t=S.timer;return t.acc+(t.run?(Date.now()-t.t0)/1000:0)}
function closeTimer(){clearInterval(tickId);S.timer=null;$('#tmr').hidden=true;document.body.style.overflow='';try{wake&&wake.release()}catch(e){}wake=null;try{speechSynthesis.cancel()}catch(e){}}
function stageHTML(big,name,cue,next){return `<div class="big">${esc(big)}</div><div class="mv">${esc(name)}</div>${cue?`<div class="cue">${esc(cue)}</div>`:''}${next?`<div class="nx">next › ${esc(next)}</div>`:''}`}
function seqPos(t,el){let acc=0,i=0;while(i<t.steps.length&&el>=acc+t.steps[i][1]){acc+=t.steps[i][1];i++}return {i,acc}}
function drawTimer(full){
 const t=S.timer;if(!t)return;const el=elapsed(),ov=$('#tmr');
 if(full||!ov.querySelector('.clock'))buildTimer(t);
 let clock='',sub='',stage='',key='',rest=false,done=false,prog=0;
 const w=t.w;
 if(el<0){
  clock=String(Math.ceil(-el));key='ready';
  const first=t.kind==='seq'?t.steps[0][0]:t.kind==='boss'?t.boss.test:sayAmt(w.items[0]);
  stage=stageHTML('READY',t.kind==='seq'?t.label:t.kind==='boss'?t.boss.n:w.name,'',`first: ${first}`);
 }else if(t.kind==='play'){
  const cap=t.total,up=w.format==='fortime'||w.format==='chipper';
  clock=up?fmt(el):fmt(cap-el);if(el>=cap)done=true;
  const s=stepAt(t,t.pos),n=w.items.length,nx=stepAt(t,t.pos+1),ts=totalSteps(t),last=t.pos+1>=ts;
  key='p'+t.pos;
  stage=stageHTML(amtText(s.it.amt*s.mult,s.it.u),s.it.n,s.it.c,last?'finish':amtText(nx.it.amt*nx.mult,nx.it.u)+' '+short(nx.it.n));
  sub=w.format==='fortime'?`round ${s.round+1} of ${w.rounds||4} · move ${s.idx+1} of ${n} · cap ${fmt(cap)}`:w.format==='chipper'?`move ${s.idx+1} of ${n} · cap ${fmt(cap)}`:w.format==='ladder'?`rung ${s.round+1} · ${s.round} rung${s.round===1?'':'s'} done`:`round ${s.round+1} · ${s.round} done`;
  prog=up?t.pos/ts:el/cap;
 }else if(t.kind==='emom'){
  const m=Math.floor(el/60),n=w.items.length,it=w.items[m%n],nx=w.items[(m+1)%n];
  clock=fmt(60-(el%60));key='e'+m;if(el>=t.total)done=true;
  stage=stageHTML(amtText(it.amt,it.u),it.n,'Finish the reps, rest the rest of the minute.',m+1<t.total/60?amtText(nx.amt,nx.u)+' '+short(nx.n):'finish');
  sub=`minute ${Math.min(m+1,t.total/60)} of ${t.total/60}`;prog=el/t.total;
 }else if(t.kind==='int'){
  const m=Math.floor(el/60),s=el%60,n=w.items.length,it=w.items[m%n],nx=w.items[(m+1)%n],work=t.work;
  rest=s>=work;clock=String(Math.ceil(rest?60-s:work-s));key='i'+m+(rest?'r':'w');if(el>=t.total)done=true;
  stage=rest?stageHTML('REST','breathe',`next: ${nx.n}`,''):stageHTML(`${work}s`,it.n,it.c,`rest, then ${short(nx.n)}`);
  sub=`round ${Math.floor(m/n)+1} of ${Math.ceil(t.total/60/n)} · move ${m%n+1} of ${n}`;prog=el/t.total;
 }else if(t.kind==='boss'){
  const B=t.boss;key='b';
  if(B.cd){clock=fmt(B.cd-el);if(el>=B.cd)done=true;prog=el/B.cd}else{clock=fmt(el)}
  stage=stageHTML(B.n,B.test,'','');sub=B.cd?'tap +1 for every rep':'tap Stop when you are done';
 }else if(t.kind==='seq'){
  const {i,acc}=seqPos(t,el);
  if(i>=t.steps.length)done=true;
  else{const st=t.steps[i];clock=fmt(acc+st[1]-el);key='s'+i;rest=/easy|breath|walk/i.test(st[0]);
   stage=stageHTML(fmt(st[1]),st[0],'',t.steps[i+1]?t.steps[i+1][0]:'finish');sub=`${i+1} of ${t.steps.length} · ${t.label}`;prog=el/t.total}
 }
 // sounds + voice on second boundaries
 const sec=Math.floor(el);
 if(t.run&&sec!==t.last){
  t.last=sec;
  if(el<0&&sec>-4)beep(520,.08);
  if(sec===0){beep(990,.35);if(t.kind==='play')say(`Go. ${sayAmt(w.items[0])}`);else if(t.kind==='int')say(`Go. ${spoken(w.items[0].n)}`);else if(t.kind==='emom')say(`Minute 1. ${sayAmt(w.items[0])}`)}
  if(sec>0&&(t.kind==='play'||(t.kind==='boss'&&t.boss.cd))){
   const cap=t.kind==='boss'?t.boss.cd:t.total;
   if(sec===Math.floor(cap/2)&&cap>=120)say('Halfway');
   if(cap-sec===60&&cap>=180)say('One minute left');
   if(cap-sec===10)say('Ten seconds');
   if(cap-sec<=3&&cap-sec>0)beep(660,.06);
   if(t.kind==='play'&&sec%60===0)beep(780,.05);
  }
  if(t.kind==='emom'&&sec>0){const s=sec%60,m=sec/60;if(s===0&&m<t.total/60){beep(990,.3);say(`Minute ${m+1}. ${sayAmt(w.items[m%w.items.length])}`)}if(s>=57)beep(660,.06)}
  if(t.kind==='int'&&sec>0){const s=sec%60,m=Math.floor(sec/60),n=w.items.length;
   if(s===0&&sec<t.total){beep(990,.3);say(`Go. ${spoken(w.items[m%n].n)}`)}
   if(s===t.work){beep(440,.3);say(`Rest. Next, ${spoken(w.items[(m+1)%n].n)}`)}
   if((s>=57)||(s>=t.work-3&&s<t.work))beep(660,.06)}
  if(t.kind==='seq'&&sec>0){const {i,acc}=seqPos(t,sec);if(acc===sec&&i<t.steps.length){beep(990,.3);say(t.steps[i][0])}else{const p=seqPos(t,sec+3);if(p.i>i&&i<t.steps.length)beep(660,.06)}}
 }
 if(done&&t.run){t.acc=elapsed();t.run=false;beep(990,.6);setTimeout(()=>beep(990,.6),400);say(t.kind==='seq'?'Done.':'Time. Nice work.');finishTimer(true);return}
 const c=ov.querySelector('.clock');c.textContent=clock;c.classList.toggle('rest',rest);
 if(key!==t.stage){t.stage=key;ov.querySelector('.stage').innerHTML=stage;const q=ov.querySelector('.queue');if(q)q.innerHTML=queueHTML(t,el)}
 ov.querySelector('.sub').textContent=sub;
 const bar=ov.querySelector('.tbar i');if(bar)bar.style.width=Math.round(Math.max(0,Math.min(1,prog))*100)+'%';
 const pb=$('#tpause');if(pb)pb.textContent=t.run?'Pause':'Resume';
 const db=$('#tdone');if(db)db.disabled=el<0;
}
// the round at a glance: done, current, and what is left
function queueHTML(t,el){
 if(el<0)return '';
 const row=(mark,amt,name,cls)=>`<div class="q ${cls}"><span class="qm">${mark}</span><span class="qa">${esc(amt)}</span><span class="qn">${esc(name)}</span></div>`;
 if(t.kind==='play'){const s=stepAt(t,t.pos),w=t.w;
  return `<div class="qh">${w.format==='ladder'?'rung '+(s.round+1):w.format==='chipper'?'the list':'round '+(s.round+1)}</div>`+w.items.map((it,i)=>row(i<s.idx?'✓':i===s.idx?'▸':'·',amtText(it.amt*s.mult,it.u),short(it.n),i<s.idx?'d':i===s.idx?'c':'')).join('')}
 if(t.kind==='emom'||t.kind==='int'){const m=Math.floor(el/60),n=t.w.items.length;
  return `<div class="qh">this cycle</div>`+t.w.items.map((it,i)=>row(i<m%n?'✓':i===m%n?'▸':'·',t.kind==='int'?t.work+'s':amtText(it.amt,it.u),short(it.n),i<m%n?'d':i===m%n?'c':'')).join('')}
 if(t.kind==='seq'){const {i}=seqPos(t,el);return t.steps.slice(i+1,i+4).map(st=>row('·',fmt(st[1]),st[0],'')).join('')}
 return '';
}
function buildTimer(t){
 const ov=$('#tmr'),w=t.w,title=w?w.name:t.label;
 const main=t.kind==='play'?`<div class="playbtns"><button data-a="tback" aria-label="Back one move">‹ Back</button><button class="pri" id="tdone" data-a="tdone">DONE ✓</button></div>`
  :t.kind==='boss'&&t.boss.cd?`<div class="counter"><button data-a="tm" data-v="-1" aria-label="Minus one">−</button><b id="cnt">${t.rounds||0}</b><button class="pri" data-a="tm" data-v="1">+1</button></div>`
  :t.kind==='seq'?`<div class="playbtns"><button data-a="tskip" aria-label="Skip this step">Skip ›</button></div>`:'';
 ov.innerHTML=`<div class="thead"><div class="prompt">$ <i>run</i> ${esc(title)}</div>${w?`<span class="tag a">${esc(fmtL(w))}</span>`:''}</div>
 <div class="tbar"><i></i></div>
 <div class="clock ${t.kind==='play'||t.kind==='int'||t.kind==='emom'?'mid':''}"></div>
 <div class="stage"></div><div class="sub"></div><div class="grow"><div class="queue"></div></div>
 ${main}
 <div class="btns tctl"><button class="sm" data-a="tpause" id="tpause">Pause</button><button class="sm" data-a="tmute" id="tmute">${voiceOn()?'Voice on':'Voice off'}</button><button class="sm" data-a="tfinish">${t.kind==='seq'?'Done':t.kind==='boss'&&!t.boss.cd?'Stop':'Finish'}</button></div>
 <button class="ghost sm" data-a="tquit">Quit without saving</button>`;
 t.stage=null;
}
function finishTimer(auto){
 const t=S.timer;if(!t)return;const el=Math.max(0,Math.round(elapsed()));
 if(t.kind==='boss'){
  const B=t.boss;closeTimer();
  S.bossDraft={id:B.id,v:B.cd?String(t.rounds||0):B.unit==='time'?fmt(el):String(el)};
  S.tab='hero';S.heroTab='boss';S.flash=`> ${B.n}: ${B.cd?(t.rounds||0)+' reps':B.unit==='time'?fmt(el):el+'s'}. Check it, then tap Log.`;render();
  setTimeout(()=>$('#boss-'+B.id)?.scrollIntoView({block:'center'}),50);return;
 }
 if(t.kind==='seq'){
  closeTimer();
  const m=withXP(()=>editDay(t.k,d=>{if(t.which==='warm')d.warm=true;if(t.which==='cool')d.cool=true;if(t.which==='mob')d.mob={...(d.mob||{}),done:true,routine:mobFor(t.k).name};if(t.which==='run'){d.run={...(d.run||{}),plan:runFor(t.k).name,time:d.run?.time??el}}}));
  if(m.length)S.flash='> '+m.join('\n');render();return;
 }
 const w=t.w,pr={};
 if(w.format==='fortime'||w.format==='chipper')pr.time=Math.min(el,t.total);
 if(w.format==='amrap'||w.format==='ladder'){
  const n=w.items.length;pr.rounds=Math.floor(t.pos/n);
  if(w.format==='amrap'){let reps=0;for(let i=0;i<t.pos%n;i++){const it=w.items[i];if(it.u!=='sec')reps+=it.u==='side'?it.amt*2:it.amt}if(reps)pr.reps=reps}
 }
 closeTimer();S.pendingResult=pr;S.form=t.k;S.rating=null;S.view=t.k;S.tab='today';render();
 setTimeout(()=>$('#r-notes')?.scrollIntoView({block:'center'}),50);
}

// seconds per rep by movement pattern, used to estimate For Time / Chipper length
const PACE={push:2.2,vpush:2.6,dip:2.2,pull:3.6,row:2.6,arms:2.5,squat:2.2,lunge:2.6,hinge:2.3,core:2.6,burpee:4.5,cardio:1.3,sprint:28};
function itemSecs(it,mult=1){const n=it.amt*mult;if(it.u==='sec')return n;return (it.u==='side'?n*2:n)*(PACE[it.pat]||2.5)}
function estimateMins(w){
 if(w.format==='intervals')return (w.rounds||4)*w.items.length;
 if(w.format==='amrap'||w.format==='ladder'||w.format==='emom')return w.mins||20;
 const rounds=w.format==='fortime'?(w.rounds||4):1;
 const work=w.items.reduce((a,it)=>a+itemSecs(it),0)*rounds;
 const trans=w.items.length*rounds*8;
 return Math.min(w.mins||20,Math.max(4,Math.round((work*1.15+trans)/60)));
}
function difficulty(w){
 const base={fortime:3,chipper:3.5,amrap:3,emom:2.5,intervals:3,ladder:3}[w.format]||3;
 const vols=w.items.map(it=>(S.profile.levels[it.pat]||{v:1}).v),v=vols.reduce((a,b)=>a+b,0)/vols.length;
 let d=base+(v-1)*4+((w.mins||20)-20)/10;
 if(w.items.some(it=>it.pat==='burpee'||it.pat==='sprint'))d+=.5;
 if(w.format==='fortime'&&estimateMins(w)>=(w.mins||20))d+=.5;
 if(w.deload)d-=1;if(w.recovery)d-=1;
 return Math.max(1,Math.min(5,Math.round(d)));
}

const monOf=k=>addDays(k,-((parseKey(k).getDay()+6)%7));
function weekReport(mon){
 const g=S.profile.goals,h=computeHero(),days=Array.from({length:7},(_,i)=>addDays(mon,i));
 let sessions=0,xp=0,reps=0,prot=0,water=0,logged=0;
 for(const k of days){const d=getDay(k);if(dayDone(k))sessions++;xp+=h.perDay[k]||0;
  if(d.workout&&d.workout.result)for(const it of d.workout.items)reps+=estReps(d.workout,it);
  if(d.protein!=null||d.water!=null){logged++;if(+d.protein>=g.protein)prot++;if(+d.water>=g.water)water++}}
 const end=days[6],inWk=k=>k>=mon&&k<=end;
 const prs=[];for(const b of BOSSES){let best=null;for(const e of (S.profile.bosses||{})[b.id]||[]){const better=best==null||(b.lower?e.v<best:e.v>best);if(better&&inWk(e.k)&&best!=null)prs.push(`${b.n} ${bossFmt(b,e.v)}`);best=best==null?e.v:(b.lower?Math.min(best,e.v):Math.max(best,e.v))}}
 const ups=(S.profile.log||[]).filter(e=>inWk(e.k)&&/▲/.test(e.m)).map(e=>e.m.replace(/^▲ /,''));
 let streak=0;for(let k=end;k>=S.profile.start&&(dayDone(k)||isRest(k));k=addDays(k,-1))streak++;
 const planned=days.filter(k=>!isRest(k)).length;
 return {mon,end,sessions,planned,xp,reps,prot,water,logged,prs,ups,streak};
}

 beep(523,.08);setTimeout(()=>beep(784,.18),140);

/* ============ Apple Health import (via a Shortcut that copies a summary) ============ */
function parseHealth(text){
 const t=String(text||''),out={},keys=['steps','water','protein','weight','waist'];
 const re=new RegExp('('+keys.join('|')+')\\s*[:=]','gi'),marks=[];let m;
 while((m=re.exec(t)))marks.push({k:m[1].toLowerCase(),at:m.index,end:re.lastIndex});
 marks.forEach((mk,i)=>{
  const block=t.slice(mk.end,i+1<marks.length?marks[i+1].at:t.length);
  const nums=(block.match(/-?\d[\d,]*\.?\d*/g)||[]).map(x=>parseFloat(x.replace(/,/g,''))).filter(x=>!isNaN(x));
  if(!nums.length)return;
  let v=mk.k==='weight'||mk.k==='waist'?nums[nums.length-1]:nums.reduce((a,b)=>a+b,0);
  if(mk.k==='water'&&/\bm[lL]\b/.test(block))v=v/29.574;
  if(mk.k==='water'&&/\bL\b/.test(block)&&!/\bm[lL]\b/.test(block))v=v*33.814;
  if(mk.k==='weight'&&/\bkg\b/i.test(block))v=v*2.2046;
  if(mk.k==='waist'&&/\bcm\b/i.test(block))v=v/2.54;
  out[mk.k]=Math.round(v*(mk.k==='weight'||mk.k==='waist'?10:1))/(mk.k==='weight'||mk.k==='waist'?10:1);
 });
 return out;
}
function applyHealth(h){
 const k=TODAY(),got=[];
 const m=withXP(()=>editDay(k,d=>{
  if(h.steps!=null&&h.steps>(+d.steps||0)){d.steps=Math.round(h.steps);got.push(`${d.steps.toLocaleString()} steps`)}
  if(h.water!=null&&h.water>(+d.water||0)){d.water=Math.round(h.water);got.push(`${d.water} oz water`)}
  if(h.protein!=null&&h.protein>(+d.protein||0)){d.protein=Math.round(h.protein);got.push(`${d.protein} g protein`)}
  if(h.weight&&h.weight>50){d.weight=h.weight;got.push(`${h.weight} lb`)}
  if(h.waist&&h.waist>10){d.meas={...(d.meas||{}),waist:h.waist};got.push(`waist ${h.waist}″`)}
 }));
 editProfile(p=>{p.healthLast=new Date().toISOString()});
 S.healthBox=false;
 S.flash=got.length?`> Imported from Health: ${got.join(', ')}.${m.length?'\n'+m.join('\n'):''}`:'> Health data read, nothing new to add for today.';
 S.view=k;render();scrollTo(0,0);
}
async function importHealth(){
 try{const txt=await navigator.clipboard.readText();const h=parseHealth(txt);if(Object.keys(h).length){applyHealth(h);return}}catch(e){}
 S.healthBox=true;S.flash='';render();setTimeout(()=>$('#health-paste')?.focus(),50);
}

/* ============ import ============ */
function importBackup(file){
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const j=JSON.parse(fr.result);if(!j||typeof j!=='object'||!j.days)throw new Error('not a rep.sh backup');
   const ids=Object.keys(j.days).filter(id=>/^d-\d{4}-\d{2}-\d{2}$/.test(id));
   for(const id of ids){S.days[id]=j.days[id];save(id)}
   if(j.profile){S.profile=mergeProfile(j.profile);save('profile')}
   clearGen();S.flash=`> Restored ${ids.length} days${j.profile?' and your profile':''} from ${file.name}.`;
  }catch(err){S.flash=`> That file couldn't be restored: ${err.message}. Pick a .json backup exported from rep.sh.`}
  render();scrollTo(0,0);
 };
 fr.onerror=()=>{S.flash='> Could not read that file.';render()};
 fr.readAsText(file);
}
/* ============ export ============ */
async function doExport(){
 const data=JSON.stringify({exported:new Date().toISOString(),profile:S.profile,days:S.days},null,1);
 try{const dl=await window.claude?.use?.('downloads');if(dl){await dl.save({filename:`rep-sh-backup-${TODAY()}.json`,data});S.flash='> Backup saved.';render();return}}catch(e){if(e&&e.code==='declined')return}
 // outside Claude: hand the file to the iPhone share sheet (Save to Files), else a plain download
 const name=`rep-sh-backup-${TODAY()}.json`;
 try{
  const file=new File([data],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'rep.sh backup'});S.flash='> Backup ready. Pick "Save to Files" to keep it.';render();return}
 }catch(e){if(e&&e.name==='AbortError')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);S.flash='> Backup downloaded.';render();return}catch(e){}
 S.flash='> Export is not available in this view.';render();
}
